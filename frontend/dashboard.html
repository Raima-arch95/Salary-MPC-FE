<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Benchmarking - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">

        <!-- Navbar -->
        <nav class="navbar">
            <h2>💼 Salary Benchmarking System</h2>
            <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
        </nav>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>Average Salary</h3>
                <p class="stat-number">₹8,50,000</p>
                <span class="stat-label">Per Annum</span>
            </div>
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p class="stat-number">124</p>
                <span class="stat-label">In System</span>
            </div>
            <div class="stat-card">
                <h3>Highest Salary</h3>
                <p class="stat-number">₹24,00,000</p>
                <span class="stat-label">Per Annum</span>
            </div>
            <div class="stat-card">
                <h3>Lowest Salary</h3>
                <p class="stat-number">₹3,20,000</p>
                <span class="stat-label">Per Annum</span>
            </div>
        </div>

        <!-- Salary Input Form -->
        <div class="form-section">
            <h2>Submit Your Salary Data</h2>
            <p>Your data is encrypted and kept confidential</p>
            <form id="salaryForm">
                <div class="form-row">
                    <div class="input-group">
                        <label>Job Title</label>
                        <input type="text" placeholder="e.g. Software Engineer">
                    </div>
                    <div class="input-group">
                        <label>Department</label>
                        <input type="text" placeholder="e.g. Engineering">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Years of Experience</label>
                        <input type="number" placeholder="e.g. 3">
                    </div>
                    <div class="input-group">
                        <label>Annual Salary (₹)</label>
                        <input type="number" placeholder="e.g. 800000">
                    </div>
                </div>
                <button type="submit" class="submit-btn">🔒 Submit Encrypted Data</button>
            </form>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
